name: Atualizar Runtime VOD Brasil

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar catálogo e M3U
        env:
          SHORTEN_URLS: 'true'
          MIN_ACTIVE_RATIO: '0.20'
        run: |
          python gerar_m3u.py --max-categories 120 --max-items 1200 --concurrency 6 --verbose

      - name: Validar saída
        run: |
          test -s runtime_vod.m3u
          echo "M3U entries:"
          grep -c '^#EXTINF:' runtime_vod.m3u
          echo "Catalog:"
          python - <<'PY'
          import json
          d=json.load(open('catalogo.json',encoding='utf-8'))
          print('itens=',len(d),'ativos=',sum(bool(x.get('active') and x.get('stream_url')) for x in d.values()))
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime_vod.m3u catalogo.json
          git diff --cached --quiet || git commit -m 'Atualizar catálogo Runtime Brasil'
          git push
