name: Atualizar Runtime VOD

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-vod-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar catálogo e M3U
        run: python gerar_m3u.py --max-pages 250 --max-items 600 --concurrency 3 --verbose

      - name: Commit alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json runtime_vod.m3u
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "Atualiza catálogo Runtime VOD"
            git push
          fi
